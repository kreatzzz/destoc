services:
  postgres:
    image: postgres:16-alpine
    container_name: destoc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: destoc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d destoc"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - destoc-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: destoc-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - destoc-redis-data:/data

volumes:
  destoc-postgres-data:
  destoc-redis-data:
